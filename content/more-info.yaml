# More Info page content: format primer, FAQ, and the rules doc link.
# Write body/answer text as folded scalars (">-") so long lines join into a
# flowing paragraph rather than forcing line breaks on the page.

primer:
  - title: What is cEDH?
    body: >-
      Competitive EDH (cEDH) is Commander played to win. Four players build
      100-card singleton decks around a legendary commander, but unlike
      casual Commander, cEDH pods are optimised around fast, resilient
      game plans — efficient mana, tight interaction, and combos that end
      the game before it drags on.

  - title: How games are run
    body: >-
      Pods are seated four to a table. Standard tournament rules apply:
      shuffled decks, revealed on request, and judge calls settled by the
      organiser on duty. Match structure and time limits are announced per
      event in the Discord — check the pinned post in the event channel
      before you sit down.

  - title: Deck legality
    body: >-
      We follow the same banlist and card pool as commander at large. 
      If you're unsure whether a card or combo is legal, ask in Discord 
      before the event rather than at the table.

faq:
  - question: Do I need an existing cEDH deck to come along?
    answer: >-
      No, and if you dont have a deck, dont worry! We have spares to lend 
      and are more than welcome to help new players navigate through the scene

  - question: Is there an entry fee?
    answer: >-
      TAll our meet ups nights are free, Events will have sign up fees, but 
      the fees go into the prize pool and costs of running the league.

