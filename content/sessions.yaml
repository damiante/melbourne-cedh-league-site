# Standing sessions — recurring weekly time/location slots, not one-off
# events. Add more entries as more standing sessions exist.
#
# `discord_url` + `cta_label` are section-level, not per-session — there's
# one league Discord, so the "join" button lives once in the Sessions
# section heading rather than repeated on every session.
#
# Each session is a shop hosting a standing slot: `time`, `title`,
# `description`, `location`, `address`, `logo`, `logo_alt`.
#
# `location` is the venue's own name + a link to their site; `address` is
# the street address + a link to the Google Maps pin. These are two
# separate links on purpose — the shop's site and its map pin are
# different URLs — both are optional and independently omittable.
# Write "description" as a folded scalar (">-") so long lines join into a
# flowing paragraph rather than forcing line breaks on the page.
#
# `logo` is an optional path/URL to the hosting shop's icon, shown in a
# fixed-size square next to the description. `logo_alt` is its alt text
# (default: empty, since the shop name is already shown as text nearby).
# Leave `logo` unset to show an empty square until a logo is available.


discord_url: "https://discordapp.com/channels/1396292459444572200/1398489361028485216"
