# Tournament organisers / hosts ("Front Office").
# Add or remove entries as the team changes — the site re-renders from this file.
# `role` is optional (e.g. Commissioner, Head Judge) — omit it to leave the
# line off the card entirely.
# discord_handle is shown as text; discord_url should link to that person's
# Discord profile (or a DM) — right-click a user in Discord and "Copy User ID",
# then use https://discord.com/users/<id> for a stable profile link.

organisers:
  - name: Example Organiser
    role: Commissioner
    discord_handle: "@example_handle"
    discord_url: "https://discord.com/users/000000000000000000"

  - name: Second Organiser
    role: Head Judge
    discord_handle: "@second_handle"
    discord_url: "https://discord.com/users/000000000000000000"
