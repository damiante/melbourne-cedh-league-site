sections:
  - title: What is Melbourne cEDH League?
    body: >-
      MCL is a community-run scene for all things cEDH. From monthly tournaments 
      to sprint leagues, the MCL hosts in person meetups for CEDH as well as online 
      games on Discord.
      Whether you're a new player, looking to play commander at a higher level or just 
      curious, the MCL is welcoming to new players and veterans alike.

  - title: What we're about
    body: >-
      Full powered, rules as written, competitively minded. We care about winning
      and tight technical play and providing a platform and community who want the 
      same thing. From people who are jamming their first Ad Naus to those casting
      their 1000th we provide a community for all.
  - title: Getting involved
    body: >-
      Everything runs out of our discord. Organize games, get information, chat and 
      brew decks, the MCL discord is the heart of the scene and gives you all the 
      information you need to come to a meet up and play with other people hungry 
      to do well and win.
